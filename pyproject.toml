[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwatch"
version = "0.1.0"
description = "Behavioral detection for AI agent execution telemetry: explainable rules over tool calls, delegation, identity, and provenance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aakash Chandra" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentwatch = "agentwatch.cli:main"

[tool.setuptools]
packages = ["agentwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
