name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -v
      - name: Demo against synthetic fixtures
        run: agentwatch analyze fixtures/*.jsonl
      - name: Benign fixture must produce no findings
        run: agentwatch analyze fixtures/benign_session.jsonl --fail-on info
